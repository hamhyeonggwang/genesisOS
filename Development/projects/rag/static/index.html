<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OTwiki 검색</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d1117;
    --sidebar: #161b22;
    --card: #21262d;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #388bfd;
    --user-bg: #1f6feb;
    --code-bg: #161b22;
    --radius: 12px;
    --sidebar-w: 280px;
  }

  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  body { display: flex; background: var(--bg); color: var(--text); font-size: 14px; }

  /* ── Sidebar ── */
  aside {
    width: var(--sidebar-w);
    min-width: var(--sidebar-w);
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 20px 16px;
    gap: 20px;
    overflow-y: auto;
  }
  .logo { font-size: 18px; font-weight: 700; color: var(--accent); letter-spacing: -0.3px; }
  .logo span { color: var(--muted); font-weight: 400; font-size: 12px; display: block; margin-top: 2px; }

  .section-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .control { display: flex; flex-direction: column; gap: 6px; }
  .control label { font-size: 12px; color: var(--muted); }

  select, input[type=range] {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 7px 10px;
    font-size: 13px;
    outline: none;
    cursor: pointer;
  }
  select:focus { border-color: var(--accent); }
  input[type=range] { padding: 6px 0; cursor: pointer; accent-color: var(--accent); }
  .range-val { font-size: 12px; color: var(--accent); font-weight: 600; text-align: right; }

  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    text-align: center;
  }
  .stat-card .num { font-size: 20px; font-weight: 700; color: var(--accent); }
  .stat-card .lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .cat-list { display: flex; flex-direction: column; gap: 4px; }
  .cat-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .cat-row span:last-child { color: var(--text); }

  .btn {
    width: 100%;
    padding: 9px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .btn:hover { background: #2d333b; border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.primary:hover { background: #1a7efb; }
  .btn-row { display: flex; gap: 8px; }
  .btn-row .btn { flex: 1; }

  /* ── Chat area ── */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .chat-header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg);
  }
  .chat-header h1 { font-size: 15px; font-weight: 600; }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #3fb950;
    flex-shrink: 0;
  }
  .status-dot.off { background: #f85149; }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* scroll bar */
  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .msg { display: flex; gap: 12px; max-width: 820px; }
  .msg.user { flex-direction: row-reverse; align-self: flex-end; }
  .msg.assistant { align-self: flex-start; width: 100%; }

  .avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }
  .msg.user .avatar { background: var(--user-bg); }
  .msg.assistant .avatar { background: var(--card); border: 1px solid var(--border); }

  .bubble {
    padding: 12px 16px;
    border-radius: var(--radius);
    line-height: 1.65;
    max-width: 100%;
  }
  .msg.user .bubble {
    background: var(--user-bg);
    border-radius: var(--radius) 4px var(--radius) var(--radius);
  }
  .msg.assistant .bubble {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 4px var(--radius) var(--radius) var(--radius);
    flex: 1;
  }

  /* Markdown inside bubble */
  .bubble p { margin-bottom: 10px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble h1,.bubble h2,.bubble h3 { margin: 14px 0 6px; color: var(--text); }
  .bubble h2 { font-size: 15px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  .bubble h3 { font-size: 14px; }
  .bubble ul, .bubble ol { padding-left: 18px; margin-bottom: 10px; }
  .bubble li { margin-bottom: 4px; }
  .bubble code {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    font-family: 'SF Mono', Consolas, monospace;
    font-size: 12px;
    color: #79c0ff;
  }
  .bubble pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    overflow-x: auto;
    margin: 10px 0;
  }
  .bubble pre code {
    background: none;
    border: none;
    padding: 0;
    font-size: 13px;
    color: #e6edf3;
  }
  .bubble table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 13px; }
  .bubble th, .bubble td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  .bubble th { background: var(--code-bg); color: var(--accent); }
  .bubble blockquote {
    border-left: 3px solid var(--accent);
    padding-left: 12px;
    color: var(--muted);
    margin: 8px 0;
  }

  /* Sources */
  .sources {
    margin-top: 10px;
    border-top: 1px solid var(--border);
    padding-top: 10px;
  }
  .sources-toggle {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 0;
  }
  .sources-toggle:hover { color: var(--accent); }
  .sources-toggle .arrow { transition: transform 0.2s; display: inline-block; }
  .sources-toggle.open .arrow { transform: rotate(90deg); }
  .sources-list { display: none; margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  .sources-list.hidden { display: none; }
  .source-item {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .source-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .source-title { font-size: 12px; font-weight: 600; color: var(--accent); }
  .source-score {
    font-size: 11px;
    background: var(--border);
    border-radius: 20px;
    padding: 1px 8px;
    color: var(--muted);
  }
  .source-path { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  .source-snippet { font-size: 12px; color: var(--muted); line-height: 1.5; }

  /* Typing indicator */
  .typing { display: flex; gap: 4px; align-items: center; padding: 4px 0; }
  .typing span {
    width: 6px; height: 6px;
    background: var(--muted);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
    40% { transform: translateY(-6px); opacity: 1; }
  }

  /* Cursor blink during streaming */
  .cursor {
    display: inline-block;
    width: 2px; height: 1em;
    background: var(--accent);
    vertical-align: text-bottom;
    margin-left: 2px;
    animation: blink 0.8s step-end infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* Welcome */
  .welcome {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    color: var(--muted);
    text-align: center;
    padding: 40px;
  }
  .welcome .icon { font-size: 48px; }
  .welcome h2 { font-size: 20px; font-weight: 600; color: var(--text); }
  .welcome p { font-size: 14px; line-height: 1.6; max-width: 400px; }
  .suggestions { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .sug-btn {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 16px;
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    text-align: left;
  }
  .sug-btn:hover { border-color: var(--accent); background: #1c2128; }

  /* Input area */
  .input-area {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    background: var(--bg);
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  .input-wrap {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: flex;
    align-items: flex-end;
    padding: 10px 14px;
    transition: border-color 0.15s;
  }
  .input-wrap:focus-within { border-color: var(--accent); }
  textarea {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 14px;
    resize: none;
    line-height: 1.5;
    max-height: 140px;
    font-family: inherit;
    overflow-y: auto;
  }
  textarea::placeholder { color: var(--muted); }
  .send-btn {
    width: 36px; height: 36px;
    border-radius: 8px;
    background: var(--accent);
    border: none;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s, transform 0.1s;
  }
  .send-btn:hover { background: #1a7efb; }
  .send-btn:active { transform: scale(0.95); }
  .send-btn:disabled { background: var(--border); cursor: not-allowed; }
  .hint { font-size: 11px; color: var(--muted); text-align: center; padding-bottom: 4px; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px; right: 24px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 13px;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.25s;
    pointer-events: none;
    z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<!-- Sidebar -->
<aside>
  <div>
    <div class="logo">🧠 OTwiki 검색<span>작업치료 · ICF · AI 지식베이스</span></div>
  </div>

  <div>
    <div class="section-label">모델 설정</div>
    <div class="control">
      <label>LLM 모델</label>
      <select id="modelSelect"></select>
    </div>
    <div class="control" style="margin-top:10px">
      <label>검색 문서 수 (top-k) <span class="range-val" id="kVal">5</span></label>
      <input type="range" id="topK" min="1" max="10" value="5">
    </div>
    <div class="control" style="margin-top:10px">
      <label>카테고리 필터</label>
      <select id="catSelect">
        <option value="전체">전체</option>
        <option value="ICF">ICF</option>
        <option value="Occupational_Therapy">작업치료</option>
        <option value="AI_sLLM">AI / sLLM</option>
        <option value="Research">연구</option>
        <option value="Lecture">강의</option>
      </select>
    </div>
  </div>

  <div>
    <div class="section-label">인덱스 현황</div>
    <div class="stats-grid">
      <div class="stat-card"><div class="num" id="statTotal">—</div><div class="lbl">총 청크</div></div>
      <div class="stat-card"><div class="num" id="statCats">—</div><div class="lbl">카테고리</div></div>
    </div>
    <div class="cat-list" id="catList" style="margin-top:10px"></div>
  </div>

  <div>
    <div class="section-label">문서 인덱싱</div>
    <div class="btn-row">
      <button class="btn" onclick="doIngest(false)">새 문서 추가</button>
      <button class="btn" onclick="doIngest(true)">전체 재인덱싱</button>
    </div>
    <div id="ingestStatus" style="font-size:12px;color:var(--muted);margin-top:8px;text-align:center"></div>
  </div>

  <div style="margin-top:auto">
    <button class="btn" onclick="clearChat()" style="width:100%">대화 초기화</button>
  </div>
</aside>

<!-- Main chat -->
<main>
  <div class="chat-header">
    <div class="status-dot" id="statusDot"></div>
    <h1>OTwiki 검색</h1>
  </div>

  <div class="messages" id="messages">
    <div class="welcome" id="welcome">
      <div class="icon">🧠</div>
      <h2>OTwiki 검색에 오신 것을 환영합니다</h2>
      <p>작업치료·ICF·AI(sLLM)·연구·강의 관련 지식을 검색하고 답변을 받아보세요.</p>
      <div class="suggestions">
        <button class="sug-btn" onclick="suggest(this)">ICF에서 활동과 참여의 차이는?</button>
        <button class="sug-btn" onclick="suggest(this)">작업치료에서 COPM을 어떻게 사용하나요?</button>
        <button class="sug-btn" onclick="suggest(this)">sLLM을 의료 현장에 적용할 때 주의사항은?</button>
        <button class="sug-btn" onclick="suggest(this)">뇌졸중 환자의 ICF 코딩 예시를 보여줘</button>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-wrap">
      <textarea id="query" rows="1" placeholder="질문을 입력하세요... (Enter: 전송, Shift+Enter: 줄바꿈)"></textarea>
    </div>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="전송">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
  <div class="hint">Ollama 로컬 모델 · ChromaDB 벡터 검색</div>
</main>

<div class="toast" id="toast"></div>

<script>
marked.setOptions({ breaks: true, gfm: true });

// ── State ─────────────────────────────────────────────────────────────────────
let streaming = false;

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  await Promise.all([loadModels(), loadStats()]);
}

async function loadModels() {
  try {
    const r = await fetch('/api/models');
    const { models } = await r.json();
    const sel = document.getElementById('modelSelect');
    sel.innerHTML = models.map(m => `<option value="${m}">${m}</option>`).join('');
    document.getElementById('statusDot').classList.toggle('off', models.length === 0);
  } catch {
    document.getElementById('statusDot').classList.add('off');
    showToast('Ollama에 연결할 수 없습니다');
  }
}

async function loadStats() {
  try {
    const r = await fetch('/api/stats');
    const data = await r.json();
    document.getElementById('statTotal').textContent = data.total ?? 0;
    const cats = data.categories ?? {};
    document.getElementById('statCats').textContent = Object.keys(cats).length;
    const list = document.getElementById('catList');
    list.innerHTML = Object.entries(cats)
      .sort((a, b) => b[1] - a[1])
      .map(([k, v]) => `<div class="cat-row"><span>${k || '기타'}</span><span>${v}</span></div>`)
      .join('');
  } catch {}
}

document.getElementById('topK').addEventListener('input', function() {
  document.getElementById('kVal').textContent = this.value;
});

// ── Chat ──────────────────────────────────────────────────────────────────────
function getInputs() {
  return {
    query: document.getElementById('query').value.trim(),
    model: document.getElementById('modelSelect').value,
    top_k: parseInt(document.getElementById('topK').value),
    category: document.getElementById('catSelect').value,
  };
}

function suggest(btn) {
  document.getElementById('query').value = btn.textContent;
  autoResize(document.getElementById('query'));
  sendMessage();
}

async function sendMessage() {
  const { query, model, top_k, category } = getInputs();
  if (!query || streaming) return;

  hideWelcome();
  streaming = true;
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('query').value = '';
  autoResize(document.getElementById('query'));

  addUserMsg(query);
  const assistantEl = addAssistantMsg();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, model, top_k, category }),
    });

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '', fullText = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        let data;
        try { data = JSON.parse(line.slice(6)); } catch { continue; }

        if (data.token !== undefined) {
          fullText += data.token;
          renderBubble(assistantEl, fullText, true);
          scrollBottom();
        }
        if (data.done) {
          renderBubble(assistantEl, fullText, false);
          if (data.sources?.length) renderSources(assistantEl, data.sources);
          scrollBottom();
        }
      }
    }
  } catch (e) {
    renderBubble(assistantEl, '⚠️ 서버 연결 오류: ' + e.message, false);
  } finally {
    streaming = false;
    document.getElementById('sendBtn').disabled = false;
  }
}

// ── DOM helpers ───────────────────────────────────────────────────────────────
function hideWelcome() {
  const w = document.getElementById('welcome');
  if (w) w.remove();
}

function addUserMsg(text) {
  const msg = document.createElement('div');
  msg.className = 'msg user';
  msg.innerHTML = `
    <div class="avatar">👤</div>
    <div class="bubble">${escHtml(text)}</div>`;
  document.getElementById('messages').appendChild(msg);
  scrollBottom();
}

function addAssistantMsg() {
  const msg = document.createElement('div');
  msg.className = 'msg assistant';
  msg.innerHTML = `
    <div class="avatar">🧠</div>
    <div class="bubble">
      <div class="typing"><span></span><span></span><span></span></div>
    </div>`;
  document.getElementById('messages').appendChild(msg);
  scrollBottom();
  return msg.querySelector('.bubble');
}

function renderBubble(el, text, streaming) {
  const cursor = streaming ? '<span class="cursor"></span>' : '';
  el.innerHTML = marked.parse(text) + cursor;
}

function renderSources(bubbleEl, sources) {
  const div = document.createElement('div');
  div.className = 'sources';
  div.innerHTML = `
    <button class="sources-toggle" onclick="toggleSources(this)">
      <span class="arrow">▶</span> 참고 문서 ${sources.length}건
    </button>
    <div class="sources-list hidden">
      ${sources.map(s => `
        <div class="source-item">
          <div class="source-meta">
            <span class="source-title">${escHtml(s.doc_title)} — ${escHtml(s.section)}</span>
            <span class="source-score">${Math.round(s.score * 100)}%</span>
          </div>
          <div class="source-path">📄 ${escHtml(s.source)}</div>
          <div class="source-snippet">${escHtml(s.content)}</div>
        </div>`).join('')}
    </div>`;
  bubbleEl.appendChild(div);
}

function toggleSources(btn) {
  const list = btn.nextElementSibling;
  const open = list.classList.toggle('hidden');
  btn.classList.toggle('open', !open);
}

function clearChat() {
  const msgs = document.getElementById('messages');
  msgs.innerHTML = '';
  const welcome = document.createElement('div');
  welcome.id = 'welcome';
  welcome.className = 'welcome';
  welcome.innerHTML = `
    <div class="icon">🧠</div>
    <h2>대화가 초기화됐습니다</h2>
    <p>새 질문을 입력해보세요.</p>`;
  msgs.appendChild(welcome);
}

// ── Ingest ────────────────────────────────────────────────────────────────────
async function doIngest(reset) {
  const el = document.getElementById('ingestStatus');
  el.textContent = reset ? '전체 재인덱싱 중...' : '새 문서 추가 중...';
  try {
    const r = await fetch(`/api/ingest?reset=${reset}`, { method: 'POST' });
    const data = await r.json();
    el.textContent = `완료: ${data.added}개 추가 (총 ${data.total}개)`;
    loadStats();
    showToast(`✅ ${data.added}개 청크 인덱싱 완료`);
  } catch (e) {
    el.textContent = '오류: ' + e.message;
  }
}

// ── Utils ─────────────────────────────────────────────────────────────────────
function scrollBottom() {
  const msgs = document.getElementById('messages');
  msgs.scrollTop = msgs.scrollHeight;
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// Keyboard
document.getElementById('query').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.getElementById('query').addEventListener('input', function() { autoResize(this); });

init();
</script>
